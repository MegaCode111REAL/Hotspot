<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotspot — Demo</title>
<link rel="stylesheet" href="hotspot.css">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--hotspot-bg-page); font-family:'Inter',Arial,sans-serif; }
  .diagram {
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><rect width="900" height="600" fill="%23dce8e6"/><rect x="60" y="80" width="180" height="140" fill="%237ba69b"/><polygon points="60,80 150,20 240,80" fill="%235c8880"/><rect x="700" y="380" width="150" height="120" fill="%237ba69b"/><rect x="230" y="380" width="40" height="140" fill="%23a9c4bf"/><line x1="270" y1="450" x2="700" y2="440" stroke="%23a9c4bf" stroke-width="14"/><ellipse cx="130" cy="480" rx="120" ry="60" fill="%236ea8c7"/></svg>');
  }
</style>
</head>
<body>

<div class="diagram" id="diagram"></div>

<!-- Classic <script> tag usage — attaches window.Hotspot -->
<script src="hotspot.js"></script>
<script>
  // Optional: change library-wide defaults once
  Hotspot.configure({ popupWidth: 260 });

  Hotspot.makeHotspot({
    x: 150, y: 150,
    heading: 'Reservoir',
    body: 'Water is stored at height behind the dam. <a href="#" target="_blank">Learn more</a>.'
  });

  Hotspot.makeHotspot({
    x: 250, y: 450,
    heading: 'Penstock',
    body: 'A pressurised pipe channels water down to the turbine.',
    color: 'orange'
  });

  Hotspot.makeHotspot({
    x: 780, y: 440,
    heading: 'Power Station',
    body: 'Falling water spins a turbine, which drives a generator.',
    color: 'purple'
  });

  // Legacy positional call still works: makeHotspot(x, y, heading, body)
  Hotspot.makeHotspot(130, 480, 'River', 'Water returns to the river downstream, ready for the cycle to continue.');
</script>

</body>
</html>
